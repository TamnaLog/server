services:
  api:
    build:
      context: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tour}
      MYSQL_USER: ${MYSQL_USER:-tour}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tour_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 최초 기동(= mysql-data 볼륨이 비어 있을 때)에만 파일명 순서대로 자동 실행된다.
      # 01-schema.sql -> 02-data-mock.sql
      - ./scripts/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:

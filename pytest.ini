[pytest]
testpaths = app
python_files = test_*.py
addopts = -q
; FastAPI 가 요청 Body 모델의 alias 를 붙이는 방식 때문에 pydantic 이
; UnsupportedFieldAttributeWarning 을 내는 버전이 있다. camelCase alias 자체는 정상 동작한다.
; 다만 pytest 는 시작할 때 filterwarnings 의 클래스를 import 해서 확인하므로,
; 그 클래스가 없는 버전(현재 requirements.txt 의 pydantic 2.11.10)에서는
; 필터를 걸어 두면 테스트가 한 개도 실행되지 않는다.
; 지금 버전에서는 해당 경고가 나오지 않아 필터를 두지 않는다.
; pydantic 을 올려서 경고가 다시 보이면 클래스가 아니라 경고 메시지로 필터를 추가한다.
;     filterwarnings =
;         ignore:<실제 경고 메시지 앞부분>
